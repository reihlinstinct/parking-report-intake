name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      notify_dry_run:
        description: "echo what the weekly-failure issue step would do, without writing"
        type: boolean
        default: false
        required: false
  schedule:
    # Weekly full suite: Sunday 06:00 Israel winter time (04:00 UTC;
    # runs 07:00 IDT in summer).
    - cron: '0 4 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Docs-only pull requests skip the heavy jobs; the Run summary gate
          # still runs and reports them as skipped.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a code-to-doc rename still shows the deleted code
          # path, so it cannot masquerade as docs-only.
          git diff --no-renames --name-only "origin/${BASE_REF}...HEAD" | tee /tmp/changed.txt
          # Doc-only allowlist: markdown/rst, license, and exact community
          # metadata names (no prefix matches) - unknown files run the suite.
          # Images always run: docs/ images are app assets.
          if grep -qvEi '\.(md|markdown|rst)$|^LICENSE$|^\.github/(CODEOWNERS|dependabot\.yml|FUNDING\.yml)$|^\.github/ISSUE_TEMPLATE/[^/]+\.(md|yml|yaml)$|^\.github/PULL_REQUEST_TEMPLATE(\.md)?$|^\.github/PULL_REQUEST_TEMPLATE/[^/]+\.md$' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  unittest:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run stdlib tests
        run: |
          python prototype.py
          python intake_validation.py
          python test_requirements_pins.py
          python test_docs_vs_code.py
          python tests/test_python_version.py

  py315:
    # Informational Python 3.15 leg (#35): continue-on-error, never a gate;
    # deliberately absent from the summary job's needs.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run stdlib tests (informational)
        run: |
          python prototype.py
          python intake_validation.py
          python test_requirements_pins.py
          python test_docs_vs_code.py
          python tests/test_python_version.py

  summary:
    permissions:
      contents: read
      issues: write
    name: Run summary
    if: always()
    needs: [changes, unittest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
      - name: Open an issue when a scheduled weekly run fails
        # Runs only when the gate above failed on a cron-triggered run; PR and
        # push failures stay in the normal review path. The dedupe search is
        # date-free, so a later weekly failure comments on the open issue
        # instead of opening a new one. workflow_dispatch with notify_dry_run
        # echoes the action without writing.
        if: (failure() && github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.notify_dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_dry_run }}
        run: |
          TITLE="Weekly full test run failed $(date +%Y-%m-%d)"
          EXISTING=$(gh issue list --state open --search "Weekly full test run failed in:title" --json number --jq '.[0].number // empty')
          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              echo "dry run: would comment on open issue #$EXISTING with run URL $RUN_URL"
            else
              echo "dry run: would create issue '$TITLE' with run URL $RUN_URL"
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Another scheduled weekly run failed: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled weekly full test run failed: $RUN_URL (visible-failure tracking, issue #29)"
          fi
